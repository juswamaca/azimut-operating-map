<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important} html,body{margin:0} img{max-width:100%}
.opmap-loading{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);margin:0;padding:10px 18px;border-radius:999px;background:#14376F;color:#F8FBFD;font:500 14px/1.3 "Work Sans",Arial,sans-serif;box-shadow:0 6px 20px rgba(20,55,111,.25);z-index:50}</style>
<!-- The Human-AI Enterprise · an NUS MBA consulting project with Azimut Investment Management Singapore · Hung Wan Yu · Apoorva Kushwaha · Joshua Macapugay -->
<title>Azimut Operating Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=Work+Sans:wght@400..600&display=swap">
<style>
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --surface-2:#EEF3F8; --stage:#F8FBFD;
  --ink:#1E2633; --body:#434548; --muted:#5F6B7B;
  --navy:#14376F; --steel:#356292; --sky:#A9C8EE; --on-navy:#FFFFFF;
  --line:#C9D6E4; --line-soft:#DFE7F0;
  --hl-bg:#E6EEF6; --hl-line:#A9C8EE;
  --wire:#BCCADB; --wire-on:#356292;
  --agent-bg:#FEF1E4; --agent-line:#D9894A; --agent-ink:#5C2A06; --agent-lbl:#A14A0B; --agent-strong:#D9894A; --agent-on:#2A1404;
  --cnt-sel:rgba(255,255,255,.2);
  --shadow:0 1px 2px rgba(20,55,111,.06),0 3px 10px rgba(20,55,111,.06);
  --logo-filter:none;
  --rust:#B4461A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1422; --surface:#132137; --surface-2:#1A2B45; --stage:#0F1B2E;
    --ink:#EAF1FA; --body:#C7D3E3; --muted:#93A3B8;
    --navy:#A9C8EE; --steel:#7FA9DA; --sky:#35557F; --on-navy:#0B1422;
    --line:#2B3F5E; --line-soft:#1F3150;
    --hl-bg:#1C3253; --hl-line:#3F6597;
    --wire:#30466A; --wire-on:#7FA9DA;
    --agent-bg:#3A2614; --agent-line:#B8733A; --agent-ink:#F6D2B0; --agent-lbl:#F0A15E; --agent-strong:#F0A15E; --agent-on:#2A1404;
    --cnt-sel:rgba(11,20,34,.16);
    --shadow:none;
    --logo-filter:brightness(0) invert(.92);
    --rust:#F08A5D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1422; --surface:#132137; --surface-2:#1A2B45; --stage:#0F1B2E;
  --ink:#EAF1FA; --body:#C7D3E3; --muted:#93A3B8;
  --navy:#A9C8EE; --steel:#7FA9DA; --sky:#35557F; --on-navy:#0B1422;
  --line:#2B3F5E; --line-soft:#1F3150;
  --hl-bg:#1C3253; --hl-line:#3F6597;
  --wire:#30466A; --wire-on:#7FA9DA;
  --agent-bg:#3A2614; --agent-line:#B8733A; --agent-ink:#F6D2B0; --agent-lbl:#F0A15E; --agent-strong:#F0A15E; --agent-on:#2A1404;
  --cnt-sel:rgba(11,20,34,.16);
  --shadow:none;
  --logo-filter:brightness(0) invert(.92);
    --rust:#F08A5D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font:15px/1.5 'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1680px;margin:0 auto;padding-inline:20px;padding-block:18px 36px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand img{height:30px;width:auto;filter:var(--logo-filter);flex:none}
.brand .tt{min-width:0;border-left:1px solid var(--line);padding-left:18px}
.brand h1{margin:0;font-family:Outfit,'Helvetica Neue',sans-serif;font-weight:500;font-size:22px;line-height:1.2;color:var(--navy);text-wrap:balance}
.brand p{margin:2px 0 0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.seg button[data-mode="target"][aria-pressed="true"]{background:var(--agent-strong);color:var(--agent-on)}
.seg .sw{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.controls{min-width:0;max-width:100%}
.jump{position:relative;min-width:0;flex:1 1 220px;max-width:320px}
.jump select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 34px 7px 14px;width:100%;text-overflow:ellipsis;cursor:pointer}
.jump::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* layout */
.grid{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 26px}
.mapcol{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:1080px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .mapcol{order:-1;position:static}
}
.mapcard{background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{display:inline-block;flex:none}
.lg.pill{width:22px;height:12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.lg.pill.dash{border-style:dashed;background:transparent}
.lg.box{width:18px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.lg.box.dash{border-style:dashed}
.lg.it{font-style:italic;font-size:12.5px}
.lg.dot{width:9px;height:9px;border-radius:50%;background:var(--agent-strong)}
.lg.ring{width:14px;height:14px;border-radius:50%;border:2px dashed var(--agent-strong)}
.lg.new{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--agent-lbl);border:1px solid var(--agent-line);background:var(--agent-bg);border-radius:4px;padding:0 4px;line-height:15px}
.srcnote{font-size:12px;color:var(--muted)}
.scroller{overflow-x:auto;overflow-y:hidden}
.box{position:relative}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

/* map nodes */
.collbl{position:absolute;top:16px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.root{position:absolute;width:128px;height:128px;border-radius:50%;border:0;background:var(--navy);color:var(--on-navy);display:grid;place-content:center;text-align:center;cursor:pointer;box-shadow:0 0 0 7px var(--stage),0 0 0 8px var(--line);padding:0}
.root small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.78;margin-bottom:3px}
.root span{display:block;font-family:Outfit,'Helvetica Neue',sans-serif;font-size:17px;font-weight:500;line-height:1.12}
.fn{position:absolute;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:6px 7px 6px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);color:var(--navy);font-family:Outfit,'Helvetica Neue',sans-serif;font-size:14.5px;font-weight:500;line-height:1.15;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,background-color .15s}
.fn:hover{border-color:var(--steel)}
.fn .cnt{flex:none;min-width:24px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-family:'Work Sans',sans-serif;font-size:11.5px;font-weight:600;display:inline-grid;place-content:center;font-variant-numeric:tabular-nums}
.fn .cnt.red{background:var(--agent-bg);color:var(--agent-lbl);box-shadow:inset 0 0 0 1px var(--agent-line)}
.fn.empty{border-style:dashed;background:var(--stage);color:var(--muted);box-shadow:none;padding-right:14px}
.fn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.fn[aria-pressed="true"] .cnt{background:var(--cnt-sel);color:var(--on-navy);box-shadow:none}
.fam{position:absolute;max-width:210px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:Outfit,'Helvetica Neue',sans-serif;font-size:13.5px;font-weight:500;line-height:1.3}
.fam.proposed{border-style:dashed}
.fam.on{border-color:var(--wire-on);color:var(--navy);box-shadow:0 0 0 1px var(--wire-on)}
.mode-target .fam.on{border-color:var(--agent-strong);box-shadow:0 0 0 1px var(--agent-strong)}
.fam.none{border-style:dashed;color:var(--muted);background:transparent;font-family:'Work Sans',sans-serif;font-weight:400}
.wf{position:absolute;height:24px;max-width:360px;display:inline-flex;align-items:center;gap:7px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--body);font-size:14px;white-space:nowrap;cursor:pointer;line-height:1}
.wf .nm{overflow:hidden;text-overflow:ellipsis}
.wf:hover{background:var(--hl-bg)}
.wf.later{color:var(--muted);font-style:italic}
.mode-target .wf:not(.has-t){color:var(--muted)}
.wf[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);font-style:normal}
.mode-target .wf[aria-pressed="true"]{background:var(--agent-strong);color:var(--agent-on)}
.adot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--agent-strong)}
.wf[aria-pressed="true"] .adot{background:var(--agent-on)}
.tagnew{flex:none;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--agent-lbl);border:1px solid var(--agent-line);background:var(--agent-bg);border-radius:4px;padding:0 4px;line-height:15px;font-style:normal}
.hint{position:absolute;max-width:300px;font-size:14px;color:var(--muted);line-height:1.5}
.branch{transition:opacity .35s ease}
.branch.hide{opacity:0}
.w-comp{fill:none;stroke:var(--line-soft);stroke-width:1}
.w-tick{stroke:var(--line);stroke-width:1}
.w-tick.big{stroke-width:1.5}
.w-n{font:600 11px 'Work Sans',sans-serif;fill:var(--muted);text-anchor:middle;letter-spacing:.1em}
.spoke{stroke:var(--wire);stroke-width:1.5}
.spoke.empty{stroke-dasharray:3 4}
.spoke.on{stroke:var(--wire-on);stroke-width:2.5}
.mode-target .spoke.on{stroke:var(--agent-strong)}
.w-hub{fill:none;stroke:var(--agent-strong);stroke-width:2;stroke-dasharray:7 5}
.w-hublbl{font:600 10px 'Work Sans',sans-serif;letter-spacing:.18em;fill:var(--agent-lbl);paint-order:stroke;stroke:var(--stage);stroke-width:5px;stroke-linejoin:round}
.hubdot{fill:var(--agent-strong);stroke:var(--stage);stroke-width:2}
.br{fill:none;stroke:var(--wire);stroke-width:1.4}
.br.ag{stroke:var(--agent-line);stroke-dasharray:4 3}
.br.on{stroke:var(--wire-on);stroke-width:2.4;stroke-dasharray:none}
.mode-target .br.on{stroke:var(--agent-strong)}
.end{fill:var(--wire)}
.end.ag{fill:var(--agent-line)}
.end.on{fill:var(--wire-on)}
.mode-target .end.on{fill:var(--agent-strong)}

/* panel */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--steel)}
.crumbs button:hover{text-decoration:underline}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.mode-target .eyebrow.t{color:var(--agent-lbl)}
.panel h2{margin:6px 0 4px;font-family:Outfit,'Helvetica Neue',sans-serif;font-weight:500;font-size:26px;line-height:1.18;color:var(--navy);text-wrap:balance}
.sub{font-size:13.5px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;line-height:1.4;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-soft);color:var(--ink)}
.chip.st{display:inline-flex;align-items:center;gap:6px}
.chip.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--steel)}
.chip.st.ns::before{background:var(--muted)}
.chip.ag{background:var(--agent-bg);border-color:var(--agent-line);color:var(--agent-ink)}
.roles{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.roles button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink);cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.also{margin-top:10px;font-size:12.5px;color:var(--muted)}
.lnk{border:0;background:none;padding:0;cursor:pointer;color:var(--steel);text-align:left}
.lnk:hover{text-decoration:underline}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}
.sec h3{margin:0 0 10px;font-family:Outfit,'Helvetica Neue',sans-serif;font-size:15.5px;font-weight:600;color:var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.sec h3 small{font-family:'Work Sans',sans-serif;font-size:12px;font-weight:400;color:var(--muted)}
dl.info{display:grid;grid-template-columns:88px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13.5px}
dl.info dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
dl.info dd{margin:0;min-width:0}
dl.info ul,.dl ul{margin:0;padding-left:16px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:7px 10px 7px 6px;border-radius:8px;border:1px solid transparent;font-size:13.5px;line-height:1.45}
ol.steps li.mine{background:var(--hl-bg);border-color:var(--hl-line)}
.num{font-family:Outfit,sans-serif;font-weight:600;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
li.mine .num{color:var(--navy)}
.who{display:inline-block;margin-right:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.nx{color:var(--muted);white-space:nowrap}
.keyline{display:inline-flex;align-items:center;gap:6px}
.keyline i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--hl-bg);border:1px solid var(--hl-line)}
details.dl{border-top:1px solid var(--line-soft);padding:9px 0}
details.dl:first-of-type{border-top:0;padding-top:0}
details.dl summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
details.dl summary::-webkit-details-marker{display:none}
details.dl summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.dl[open] summary::after{transform:rotate(-135deg)}
details.dl summary span{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
details.dl ul{margin-top:8px;font-size:13.5px}
details.dl li+li{margin-top:4px}
.empty{font-size:14px;color:var(--muted);margin:14px 0 0}
.callout{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--agent-bg);border:1px solid var(--agent-line);color:var(--agent-ink);font-size:13.5px}
.callout b{display:block;font-family:Outfit,sans-serif;font-weight:600;font-size:14px;margin-bottom:3px}
.callout button{margin-top:8px;border:1px solid var(--agent-line);background:var(--surface);color:var(--agent-ink);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.big{margin:16px 0 0;padding-left:12px;border-left:3px solid var(--agent-strong);font-family:Outfit,'Helvetica Neue',sans-serif;font-size:18px;line-height:1.35;color:var(--ink);text-wrap:balance}
.today{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
ol.ts{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ol.ts li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center}
.tc{padding:8px 11px;border-radius:9px;border:1.5px solid var(--navy);background:var(--surface);font-size:13.5px;line-height:1.4;color:var(--body)}
.tc .who{color:var(--navy)}
.tc.agent{background:var(--agent-bg);border-color:var(--agent-line);color:var(--agent-ink)}
.tc.agent .who{color:var(--agent-lbl)}
.tc.decision{border:2px dashed var(--navy)}
.tkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-family:'Work Sans',sans-serif;font-weight:400}
.tkey span{display:inline-flex;align-items:center;gap:6px}
.tkey i{display:inline-block;width:16px;height:11px;border-radius:3px;border:1.5px solid var(--navy);background:var(--surface)}
.tkey i.a{border-color:var(--agent-line);background:var(--agent-bg)}
.tkey i.d{border:1.5px dashed var(--navy)}
.agents{display:grid;gap:8px}
.ac{padding:10px 12px;border-radius:10px;border:1px solid var(--agent-line);background:var(--agent-bg);color:var(--agent-ink);font-size:13px;line-height:1.45}
.ac .an{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:Outfit,sans-serif;font-weight:600;font-size:15px}
.ac .an small{font-family:'Work Sans',sans-serif;font-weight:500;font-size:11.5px;color:var(--agent-lbl);white-space:nowrap}
.ac div+div{margin-top:2px}
.ac em{font-style:normal;color:var(--agent-lbl);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
ul.plain{margin:0;padding-left:16px;font-size:13.5px}
ul.plain li+li{margin-top:4px}
.fgroup{margin-top:16px}
.fgroup h3{margin:0 0 6px;font-family:Outfit,sans-serif;font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.ptag{font-family:'Work Sans',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px}
ul.wl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.wl button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:6px 8px;text-align:left;cursor:pointer;font-size:13.5px;color:var(--body)}
ul.wl button:hover{background:var(--hl-bg)}
ul.wl .nm{flex:1;min-width:0}
ul.wl .mt{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
ul.wl .later .nm{font-style:italic;color:var(--muted)}
.tblwrap{overflow-x:auto;margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line-soft)}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t tr.tot td{border-bottom:0;font-weight:600;color:var(--ink)}
table.t td.z{color:var(--muted)}
.pods{display:grid;gap:12px}

<script>
(function(){
  var C = window.OPMAP_CONFIG || {};
  var tag = document.getElementById('opmap-data');
  var toast = document.createElement('p');
  toast.className = 'opmap-loading'; toast.setAttribute('role', 'status');
  toast.textContent = C.csvUrl ? 'Reading the master sheet…' : 'Loading the operating map…';
  document.body.appendChild(toast);
  function stamp(d){
    try { return new Intl.DateTimeFormat('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Singapore'}).format(d); }
    catch(e){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function boot(d){
    tag.textContent = JSON.stringify(d);
    toast.remove();
    var s = document.createElement('script'); s.src = 'app.js'; document.body.appendChild(s);
  }
  async function live(){
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, C.timeoutMs || 8000);
    try {
      var res = await fetch(C.csvUrl, {cache:'no-store', signal: ctl ? ctl.signal : undefined});
      if(!res.ok) throw new Error('the sheet link answered with error ' + res.status);
      var text = await res.text();
      if(/^\s*</.test(text)) throw new Error('the sheet link returned a web page, not CSV (use File > Share > Publish to web, and choose CSV)');
      var notes = [];
      var d = OpmapBuild.buildMapData(OpmapBuild.parseCSV(text), DESIGN, {source: C.sourceLabel || 'Operating Map Master', readAt: stamp(new Date()), live: true}, notes);
      if(!d.workflows.some(function(w){ return !w.targetOnly; })) throw new Error('no workflows were found in the sheet');
      d.syncNotes = notes;
      return d;
    } finally { clearTimeout(timer); }
  }
  async function saved(why){
    var res = await fetch('data/snapshot.json', {cache:'no-store'});
    var d = await res.json();
    d.live = true; d.stale = true;
    d.syncNotes = ['Showing the saved copy because ' + why + '.'].concat(d.syncNotes || []);
    return d;
  }
  (async function(){
    var d = null, why = C.csvUrl ? '' : 'no sheet link is set in config.js yet';
    if(C.csvUrl){
      try { d = await live(); }
      catch(e){ why = (e && e.name === 'AbortError') ? 'the sheet took too long to answer' : (e && e.message) || 'the sheet could not be read'; console.warn('Operating map: ' + why); }
    }
    if(!d){
      try { d = await saved(why); }
      catch(e){ toast.textContent = 'The operating map could not load. Refresh the page to try again.'; return; }
    }
    boot(d);
  })();
})();
</script>
